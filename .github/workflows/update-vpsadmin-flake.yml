name: Update vpsAdmin flake input

on:
  schedule:
    - cron: '20 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

env:
  CONFCTL_FLAKE: github:vpsfreecz/confctl/822c0e35dbe2549111912f539116b4225dfd3035#confctl
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout provider
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Install Nix
        uses: cachix/install-nix-action@31.11.3

      - name: Restore confctl cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            confctl-cache-${{ runner.os }}

      - name: Save lock baseline
        run: |
          cp flake.lock "$RUNNER_TEMP/flake-update-baseline.lock"
          echo "UPDATE_OLD_LOCK=$RUNNER_TEMP/flake-update-baseline.lock" >> "$GITHUB_ENV"

      - name: Setup git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update vpsAdmin input
        run: tools/update-vpsadmin-flake-input.sh

      - name: Push update
        run: |
          final_lock="$RUNNER_TEMP/flake-update-final.lock"
          git show HEAD:flake.lock > "$final_lock"
          nix shell "$CONFCTL_FLAKE" -c confctl inputs check-update \
            --old-lock "$UPDATE_OLD_LOCK" --new-lock "$final_lock"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Save confctl cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/confctl
          key: confctl-cache-${{ runner.os }}-${{ github.run_id }}
